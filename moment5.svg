<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="coffeeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5eb" />
      <stop offset="50%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
    <radialGradient id="cafeGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#ffedd5" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#coffeeBg)"/>
  <circle cx="300" cy="220" r="160" fill="url(#cafeGlow)"/>
  <!-- Table surface -->
  <path d="M0 380 Q300 350 600 380 L600 500 L0 500 Z" fill="#78350f" opacity="0.15"/>
  <rect x="0" y="400" width="600" height="100" fill="#92400e" opacity="0.25"/>
  <!-- Left Coffee Cup (Pink) -->
  <g transform="translate(240, 310)">
    <ellipse cx="0" cy="55" rx="45" ry="12" fill="#d97706" opacity="0.2"/>
    <path d="M-36 0 C-34 45 34 45 36 0 Z" fill="#ff758f"/>
    <path d="M-34 0 C-32 40 32 40 34 0 Z" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="34" ry="10" fill="#78350f"/>
    <!-- Latte Art Heart -->
    <path d="M0 -3 C-7 -10 -18 -4 -18 3 C-18 9 0 15 0 17 C0 15 18 9 18 3 C18 -4 7 -10 0 -3 Z" fill="#fef3c7"/>
    <!-- Cup handle -->
    <path d="M-34 10 C-50 10 -50 35 -34 35" fill="none" stroke="#ff758f" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Right Coffee Cup (Lavender) -->
  <g transform="translate(360, 320)">
    <ellipse cx="0" cy="55" rx="45" ry="12" fill="#d97706" opacity="0.2"/>
    <path d="M-36 0 C-34 45 34 45 36 0 Z" fill="#ec4899"/>
    <path d="M-34 0 C-32 40 32 40 34 0 Z" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="34" ry="10" fill="#78350f"/>
    <!-- Latte Art Heart -->
    <path d="M0 -3 C-7 -10 -18 -4 -18 3 C-18 9 0 15 0 17 C0 15 18 9 18 3 C18 -4 7 -10 0 -3 Z" fill="#fef3c7"/>
    <!-- Cup handle -->
    <path d="M34 10 C50 10 50 35 34 35" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Rising Steam Hearts -->
  <g filter="url(#softGlow5)">
    <path d="M300 220 Q290 190 305 160 Q320 130 300 100" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M300 85 C285 60 250 75 250 95 C250 120 300 145 300 155 C300 145 350 120 350 95 C350 75 315 60 300 85 Z" fill="#f43f5e" opacity="0.75"/>
  </g>
  <!-- Sparkles -->
  <circle cx="150" cy="180" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="450" cy="190" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="210" cy="120" r="3.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="410" cy="110" r="4" fill="#ffffff" opacity="0.85"/>
  <text x="300" y="475" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="16" fill="#78350f" text-anchor="middle" letter-spacing="3" opacity="0.9">COZY CONVERSATIONS</text>
</svg>
