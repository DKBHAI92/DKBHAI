<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="seaSunsetBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7e5f" />
      <stop offset="40%" stop-color="#feb47b" />
      <stop offset="65%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <radialGradient id="sunGlow8" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff7e5f" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#seaSunsetBg)"/>
  <!-- Glowing Sunset Sun -->
  <circle cx="300" cy="220" r="100" fill="url(#sunGlow8)"/>
  <circle cx="300" cy="220" r="35" fill="#ffffff" filter="url(#softGlow8)"/>
  <!-- Sea Ocean Surface -->
  <rect x="0" y="270" width="600" height="230" fill="#1e1b4b" opacity="0.75"/>
  <!-- Sun reflection ripples -->
  <ellipse cx="300" cy="285" rx="80" ry="4" fill="#fef08a" opacity="0.6"/>
  <ellipse cx="300" cy="305" rx="60" ry="3.5" fill="#fef08a" opacity="0.5"/>
  <ellipse cx="300" cy="325" rx="45" ry="3" fill="#fef08a" opacity="0.4"/>
  <ellipse cx="300" cy="345" rx="30" ry="2.5" fill="#fef08a" opacity="0.3"/>
  <!-- Beach Sand Foregound -->
  <path d="M0 370 Q180 340 360 380 T600 360 L600 500 L0 500 Z" fill="#431407" opacity="0.85"/>
  <!-- Drawn Heart in the Sand -->
  <g transform="translate(300, 420) scale(0.65)" filter="url(#softGlow8)">
    <path d="M0 -30 C-20 -60 -60 -40 -60 -10 C-60 25 0 60 0 70 C0 60 60 25 60 -10 C60 -40 20 -60 0 -30 Z" fill="none" stroke="#fed7aa" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="20" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#fed7aa" text-anchor="middle">S + M</text>
  </g>
  <!-- Flying birds silhouette in sunset -->
  <path d="M140 140 Q150 130 160 140 Q170 130 180 140" fill="none" stroke="#431407" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M420 120 Q428 112 436 120 Q444 112 452 120" fill="none" stroke="#431407" stroke-width="2" stroke-linecap="round"/>
  <text x="300" y="485" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="15" fill="#fed7aa" text-anchor="middle" letter-spacing="3" opacity="0.95">SUNSET &amp; SERENITY</text>
</svg>
