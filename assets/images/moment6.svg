<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="handsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="50%" stop-color="#ff7eb3" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <radialGradient id="handsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#ffb6c1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#handsBg)"/>
  <circle cx="300" cy="240" r="160" fill="url(#handsGlow)"/>
  <!-- Sunset Horizon & Ocean Waves -->
  <path d="M0 340 Q150 320 300 335 T600 330 L600 500 L0 500 Z" fill="#4c1d95" opacity="0.5"/>
  <path d="M0 380 Q200 360 400 375 T600 370 L600 500 L0 500 Z" fill="#2e1065" opacity="0.8"/>
  <!-- Intertwined Hands Silhouette -->
  <g transform="translate(300, 230)" filter="url(#softGlow6)">
    <!-- Heart in between hands -->
    <path d="M0 -30 C-20 -60 -60 -40 -60 -10 C-60 25 0 60 0 70 C0 60 60 25 60 -10 C60 -40 20 -60 0 -30 Z" fill="#ff2a5f" opacity="0.95"/>
    <path d="M0 -25 C-15 -50 -48 -33 -48 -8 C-48 20 0 50 0 58 C0 50 48 20 48 -8 C48 -33 15 -50 0 -25 Z" fill="#ffffff" opacity="0.3"/>
  </g>
  <!-- Arm Silhouettes coming together -->
  <path d="M0 290 Q160 270 250 240 Q160 360 0 380 Z" fill="#1e1b4b" opacity="0.6"/>
  <path d="M600 290 Q440 270 350 240 Q440 360 600 380 Z" fill="#1e1b4b" opacity="0.6"/>
  <!-- Stars & Fairy lights -->
  <circle cx="120" cy="110" r="3.5" fill="#ffffff"/>
  <circle cx="480" cy="120" r="4" fill="#ffffff"/>
  <circle cx="210" cy="80" r="5" fill="#ffffff" filter="url(#softGlow6)"/>
  <circle cx="390" cy="90" r="4.5" fill="#ffffff"/>
  <text x="300" y="475" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="16" fill="#fdf4ff" text-anchor="middle" letter-spacing="3" opacity="0.95">HAND IN HAND ALWAYS</text>
</svg>
