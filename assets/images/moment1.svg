<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e" />
      <stop offset="50%" stop-color="#fecfef" />
      <stop offset="100%" stop-color="#fed6e3" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ffe4b5" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff9a9e" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#bgGrad1)"/>
  <circle cx="300" cy="200" r="140" fill="url(#sunGlow)"/>
  <!-- Horizon silhouette -->
  <path d="M0 380 Q150 320 300 350 T600 340 L600 500 L0 500 Z" fill="#ff758c" opacity="0.35"/>
  <path d="M0 410 Q200 360 400 390 T600 380 L600 500 L0 500 Z" fill="#ff5858" opacity="0.45"/>
  <path d="M0 450 Q300 420 600 440 L600 500 L0 500 Z" fill="#e84a5f" opacity="0.6"/>
  <!-- Glowing Heart in Center -->
  <g transform="translate(300, 210) scale(1.3)" filter="url(#softGlow)">
    <path d="M 0,-45 C -25,-85 -75,-65 -75,-20 C -75,25 0,65 0,75 C 0,65 75,25 75,-20 C 75,-65 25,-85 0,-45 Z" fill="#ff3366" opacity="0.85"/>
    <path d="M 0,-40 C -20,-75 -65,-55 -65,-18 C -65,20 0,55 0,65 C 0,55 65,20 65,-18 C 65,-55 20,-75 0,-40 Z" fill="#ffffff" opacity="0.35"/>
  </g>
  <!-- Sparkles -->
  <circle cx="160" cy="120" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="440" cy="140" r="5" fill="#ffffff" opacity="0.95"/>
  <circle cx="210" cy="280" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="400" cy="290" r="3.5" fill="#ffffff" opacity="0.8"/>
  <polygon points="440,125 444,138 457,140 444,142 440,155 436,142 423,140 436,138" fill="#ffffff" opacity="0.9"/>
  <polygon points="160,105 163,117 175,120 163,123 160,135 157,123 145,120 157,117" fill="#ffffff" opacity="0.85"/>
  <text x="300" y="475" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="3" opacity="0.95">SUNSHINE &amp; SMILES</text>
</svg>
