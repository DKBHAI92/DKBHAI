<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="polaroidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <filter id="shadow10" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#polaroidBg)"/>
  <!-- Backdrop Polaroid (Tilted right) -->
  <g transform="translate(330, 240) rotate(12)" filter="url(#shadow10)">
    <rect x="-110" y="-140" width="220" height="270" rx="8" fill="#ffffff"/>
    <!-- Photo image area -->
    <rect x="-95" y="-125" width="190" height="180" rx="4" fill="#f43f5e"/>
    <!-- Cute silhouette heart -->
    <path d="M0 -30 C-15 -60 -50 -40 -50 -10 C-50 20 0 50 0 60 C0 50 50 20 50 -10 C50 -40 15 -60 0 -30 Z" fill="#ffffff" opacity="0.9"/>
    <text x="0" y="105" font-family="'Dancing Script', cursive" font-weight="700" font-size="20" fill="#db2777" text-anchor="middle">You &amp; Me Always ❤️</text>
  </g>
  <!-- Foreground Polaroid (Tilted left) -->
  <g transform="translate(260, 230) rotate(-8)" filter="url(#shadow10)">
    <rect x="-110" y="-140" width="220" height="270" rx="8" fill="#ffffff"/>
    <!-- Photo image area -->
    <rect x="-95" y="-125" width="190" height="180" rx="4" fill="#ec4899"/>
    <!-- Cute smile / sparkles -->
    <circle cx="0" cy="-35" r="45" fill="#fbcfe8"/>
    <!-- Heart eyes -->
    <path d="M-16 -42 C-22 -52 -32 -48 -32 -38 C-32 -28 -16 -18 -16 -12 C-16 -18 0 -28 0 -38 C0 -48 -10 -52 -16 -42 Z" fill="#e11d48"/>
    <path d="M16 -42 C10 -52 0 -48 0 -38 C0 -28 16 -18 16 -12 C16 -18 32 -28 32 -38 C32 -48 22 -52 16 -42 Z" fill="#e11d48"/>
    <!-- Smile curve -->
    <path d="M-22 -15 Q0 5 22 -15" fill="none" stroke="#e11d48" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="105" font-family="'Dancing Script', cursive" font-weight="700" font-size="21" fill="#e11d48" text-anchor="middle">Shrishti's Smile ✨</text>
  </g>
  <!-- Washi tape on top -->
  <rect x="230" y="70" width="60" height="20" rx="3" fill="#fbcfe8" opacity="0.8" transform="rotate(-5, 260, 80)"/>
  <!-- Scattered rose petals -->
  <path d="M120 380 C135 370 150 385 135 400 C120 395 115 385 120 380 Z" fill="#ff758f" opacity="0.85"/>
  <path d="M470 360 C485 350 500 365 485 380 C470 375 465 365 470 360 Z" fill="#ff758f" opacity="0.8"/>
  <path d="M420 420 C435 410 450 425 435 440 C420 435 415 425 420 420 Z" fill="#fda4af" opacity="0.75"/>
  <text x="300" y="480" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="15" fill="#e11d48" text-anchor="middle" letter-spacing="3" opacity="0.95">SNAPSHOTS OF PURE LOVE</text>
</svg>
