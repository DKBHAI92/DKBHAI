<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1eb" />
      <stop offset="50%" stop-color="#ace0f9" />
      <stop offset="100%" stop-color="#fbc2eb" />
    </linearGradient>
    <radialGradient id="flowerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#ffd1dc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbc2eb" stop-opacity="0" />
    </radialGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#bgGrad3)"/>
  <circle cx="300" cy="230" r="160" fill="url(#flowerGlow)"/>
  <!-- Cherry Blossom Branch -->
  <path d="M-20 60 Q120 110 240 80 T460 140" fill="none" stroke="#78424a" stroke-width="6" stroke-linecap="round"/>
  <path d="M120 100 Q180 180 240 190" fill="none" stroke="#78424a" stroke-width="4" stroke-linecap="round"/>
  <path d="M280 90 Q340 50 380 40" fill="none" stroke="#78424a" stroke-width="3" stroke-linecap="round"/>
  <!-- Blossom Flowers -->
  <g transform="translate(130, 95)" filter="url(#glow3)">
    <circle cx="0" cy="-12" r="10" fill="#ff758c"/>
    <circle cx="11" cy="-4" r="10" fill="#ff758c"/>
    <circle cx="7" cy="10" r="10" fill="#ff758c"/>
    <circle cx="-7" cy="10" r="10" fill="#ff758c"/>
    <circle cx="-11" cy="-4" r="10" fill="#ff758c"/>
    <circle cx="0" cy="0" r="6" fill="#fff9a6"/>
  </g>
  <g transform="translate(240, 80)" filter="url(#glow3)">
    <circle cx="0" cy="-14" r="12" fill="#ff8da1"/>
    <circle cx="13" cy="-5" r="12" fill="#ff8da1"/>
    <circle cx="8" cy="12" r="12" fill="#ff8da1"/>
    <circle cx="-8" cy="12" r="12" fill="#ff8da1"/>
    <circle cx="-13" cy="-5" r="12" fill="#ff8da1"/>
    <circle cx="0" cy="0" r="7" fill="#fff48f"/>
  </g>
  <g transform="translate(360, 120)" filter="url(#glow3)">
    <circle cx="0" cy="-10" r="9" fill="#ffaec0"/>
    <circle cx="9" cy="-3" r="9" fill="#ffaec0"/>
    <circle cx="6" cy="8" r="9" fill="#ffaec0"/>
    <circle cx="-6" cy="8" r="9" fill="#ffaec0"/>
    <circle cx="-9" cy="-3" r="9" fill="#ffaec0"/>
    <circle cx="0" cy="0" r="5" fill="#fff9a6"/>
  </g>
  <!-- Butterflies -->
  <g transform="translate(420, 240) rotate(-15)">
    <ellipse cx="-12" cy="-10" rx="14" ry="10" fill="#ff6b8b" opacity="0.85"/>
    <ellipse cx="12" cy="-10" rx="14" ry="10" fill="#ff6b8b" opacity="0.85"/>
    <ellipse cx="-8" cy="8" rx="9" ry="7" fill="#ff85a1" opacity="0.85"/>
    <ellipse cx="8" cy="8" rx="9" ry="7" fill="#ff85a1" opacity="0.85"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#4a1525" stroke-width="2.5"/>
  </g>
  <g transform="translate(180, 290) rotate(20) scale(0.75)">
    <ellipse cx="-12" cy="-10" rx="14" ry="10" fill="#ff6b8b" opacity="0.85"/>
    <ellipse cx="12" cy="-10" rx="14" ry="10" fill="#ff6b8b" opacity="0.85"/>
    <ellipse cx="-8" cy="8" rx="9" ry="7" fill="#ff85a1" opacity="0.85"/>
    <ellipse cx="8" cy="8" rx="9" ry="7" fill="#ff85a1" opacity="0.85"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#4a1525" stroke-width="2.5"/>
  </g>
  <!-- Falling Petals -->
  <path d="M160 180 C175 170 190 185 175 200 C160 195 155 185 160 180 Z" fill="#ff8da1" opacity="0.8"/>
  <path d="M290 220 C305 210 320 225 305 240 C290 235 285 225 290 220 Z" fill="#ff8da1" opacity="0.75"/>
  <path d="M330 310 C345 300 360 315 345 330 C330 325 325 315 330 310 Z" fill="#ff8da1" opacity="0.7"/>
  <text x="300" y="475" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="16" fill="#893149" text-anchor="middle" letter-spacing="3" opacity="0.9">BLOSSOM &amp; BEAUTY</text>
</svg>
