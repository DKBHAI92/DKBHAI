<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30" />
      <stop offset="50%" stop-color="#243b55" />
      <stop offset="100%" stop-color="#4a2574" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#ffb6c1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#243b55" stop-opacity="0" />
    </radialGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#bgGrad2)"/>
  <!-- Ambient Moon Glow -->
  <circle cx="450" cy="150" r="130" fill="url(#moonGlow)"/>
  <!-- Crescent Moon -->
  <path d="M 450 90 A 60 60 0 0 0 450 210 A 50 50 0 0 1 450 90 Z" fill="#fff9e6" filter="url(#glow2)"/>
  <!-- Constellation lines -->
  <polyline points="120,130 180,110 240,150 290,120 340,160" stroke="#fbcfe8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.65" fill="none"/>
  <!-- Stars -->
  <circle cx="120" cy="130" r="3.5" fill="#ffffff"/>
  <circle cx="180" cy="110" r="4.5" fill="#ffffff"/>
  <circle cx="240" cy="150" r="3" fill="#ffffff"/>
  <circle cx="290" cy="120" r="5" fill="#ffffff" filter="url(#glow2)"/>
  <circle cx="340" cy="160" r="3.5" fill="#ffffff"/>
  <!-- Floating Hearts in Night Sky -->
  <g transform="translate(230, 260) scale(0.9)" filter="url(#glow2)">
    <path d="M 0,-30 C -15,-60 -50,-45 -50,-15 C -50,15 0,45 0,55 C 0,45 50,15 50,-15 C 50,-45 15,-60 0,-30 Z" fill="#f43f5e" opacity="0.8"/>
  </g>
  <g transform="translate(140, 310) scale(0.6)" filter="url(#glow2)">
    <path d="M 0,-30 C -15,-60 -50,-45 -50,-15 C -50,15 0,45 0,55 C 0,45 50,15 50,-15 C 50,-45 15,-60 0,-30 Z" fill="#ec4899" opacity="0.7"/>
  </g>
  <!-- Foreground silhouette hills -->
  <path d="M0 420 Q180 370 360 410 T600 390 L600 500 L0 500 Z" fill="#110d26" opacity="0.8"/>
  <path d="M0 450 Q240 400 480 440 L600 430 L600 500 L0 500 Z" fill="#080518" opacity="0.95"/>
  <!-- Cute romantic text watermark -->
  <text x="300" y="480" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="16" fill="#fbcfe8" text-anchor="middle" letter-spacing="3" opacity="0.95">STARLIT MEMORIES</text>
</svg>
