<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rainBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <radialGradient id="umbrellaGlow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#ff758f" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#ff3366" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow9" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#rainBg)"/>
  <circle cx="300" cy="220" r="140" fill="url(#umbrellaGlow)"/>
  <!-- Rain streaks -->
  <g stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round" opacity="0.45">
    <line x1="100" y1="40" x2="80" y2="120" />
    <line x1="220" y1="20" x2="200" y2="100" />
    <line x1="380" y1="30" x2="360" y2="110" />
    <line x1="500" y1="50" x2="480" y2="130" />
    <line x1="140" y1="180" x2="120" y2="260" />
    <line x1="460" y1="190" x2="440" y2="270" />
    <line x1="80" y1="310" x2="60" y2="390" />
    <line x1="520" y1="320" x2="500" y2="400" />
  </g>
  <!-- The Pink Umbrella -->
  <g transform="translate(300, 210)" filter="url(#softGlow9)">
    <path d="M0 -90 C-80 -90 -120 -30 -120 0 C-80 10 -40 10 0 0 C40 10 80 10 120 0 C120 -30 80 -90 0 -90 Z" fill="#ff3366"/>
    <!-- Umbrella ribs & heart badge -->
    <path d="M0 -90 Q-40 -40 0 0" fill="none" stroke="#ffe4e6" stroke-width="2" opacity="0.6"/>
    <path d="M0 -90 Q40 -40 0 0" fill="none" stroke="#ffe4e6" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="-90" r="6" fill="#fff"/>
    <!-- Umbrella Handle -->
    <line x1="0" y1="0" x2="0" y2="100" stroke="#fecdd3" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 100 C0 115 25 115 25 100" fill="none" stroke="#fecdd3" stroke-width="5" stroke-linecap="round"/>
    <!-- Heart under umbrella -->
    <path d="M0 25 C-12 10 -30 20 -30 35 C-30 50 0 70 0 78 C0 70 30 50 30 35 C30 20 12 10 0 25 Z" fill="#ffffff" opacity="0.95"/>
  </g>
  <!-- Puddle reflection -->
  <ellipse cx="300" cy="410" rx="140" ry="25" fill="#f43f5e" opacity="0.35" filter="url(#softGlow9)"/>
  <ellipse cx="300" cy="410" rx="90" ry="12" fill="#ffffff" opacity="0.25"/>
  <text x="300" y="480" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="15" fill="#ffe4e6" text-anchor="middle" letter-spacing="3" opacity="0.95">WARMTH IN EVERY STORM</text>
</svg>
